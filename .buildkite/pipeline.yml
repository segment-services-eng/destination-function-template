# Bootstrap for the destination-function deploys.
#
# The real steps — one per function per environment — are generated by
# .buildkite/generatePipeline.js from the functions discovered on disk, so adding
# a function requires no change to this file. See that script for the DEV/QA/PROD
# gates and the deploy command.
#
# GitHub Actions (.github/workflows/deployDestinationFunction.yml) runs the same
# fan-out and is the documented primary path; this pipeline is the
# Twilio-internal option.

agents:
  # Must be a queue with connected agents on the twilio-primary-default cluster.
  # The `default` queue is paused / has no agents.
  queue: general-001

steps:
  - label: ':pipeline: Generate deploy steps'
    command: node .buildkite/generatePipeline.js | buildkite-agent pipeline upload
