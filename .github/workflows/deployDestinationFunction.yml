# Deploys every function in this repo, one matrix leg per function per
# environment.
#
#   * DEV  — feature-branch builds.
#   * QA   — when the PR carries the !!_RELEASE_TO_QA label.
#   * PROD — the main branch.
#
# The function list is discovered from the filesystem by scripts/listFunctions.js
# rather than written down here, so adding a function needs no change to this
# workflow. Each function's per-environment Segment function ID is committed in
# functions/<name>/function.json; PUBLIC_API_TOKEN is the only secret, held per
# GitHub Environment.
name: Deploy Destination Function
on:
  pull_request:
    types: [opened, synchronize, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  # Runs once per build rather than once per matrix leg, so a promotion still
  # re-validates the commit without paying for N identical test runs.
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs (not mutable tags) to prevent supply-chain tag hijacking.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm test

  discover:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.list.outputs.functions }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      # No npm install needed: listFunctions.js only reads the filesystem.
      - id: list
        run: echo "functions=$(node scripts/listFunctions.js --json)" >> "$GITHUB_OUTPUT"

  DEV:
    needs: [test, discover]
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' || github.event.label.name == '!!_RELEASE_TO_QA'
    environment: DEV
    strategy:
      # One function's failure must not cancel its siblings' deploys, and the
      # shared Public API token rate-limits under burst.
      fail-fast: false
      max-parallel: 1
      matrix:
        function: ${{ fromJSON(needs.discover.outputs.functions) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - name: Deploy ${{ matrix.function }}
        run: node ./scripts/deployDestinationFunction.js "$FUNCTION_NAME"
        env:
          # Set explicitly rather than relying on the GITHUB_JOB fallback, so
          # renaming this job cannot silently change the deploy target.
          DEPLOY_ENV: DEV
          FUNCTION_NAME: ${{ matrix.function }}
          PUBLIC_API_TOKEN: ${{ secrets.PUBLIC_API_TOKEN }}

  QA:
    needs: [test, discover]
    runs-on: ubuntu-latest
    if: github.event.label.name == '!!_RELEASE_TO_QA'
    environment: QA
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        function: ${{ fromJSON(needs.discover.outputs.functions) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - name: Deploy ${{ matrix.function }}
        run: node ./scripts/deployDestinationFunction.js "$FUNCTION_NAME"
        env:
          DEPLOY_ENV: QA
          FUNCTION_NAME: ${{ matrix.function }}
          PUBLIC_API_TOKEN: ${{ secrets.PUBLIC_API_TOKEN }}

  PROD:
    needs: [test, discover]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: PROD
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        function: ${{ fromJSON(needs.discover.outputs.functions) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - name: Deploy ${{ matrix.function }}
        run: node ./scripts/deployDestinationFunction.js "$FUNCTION_NAME"
        env:
          DEPLOY_ENV: PROD
          FUNCTION_NAME: ${{ matrix.function }}
          PUBLIC_API_TOKEN: ${{ secrets.PUBLIC_API_TOKEN }}
